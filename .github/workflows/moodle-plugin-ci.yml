name: Moodle Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moodle-plugin-ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            moodle-branch: 'MOODLE_404_STABLE'
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_500_STABLE'
          - php: '8.4'
            moodle-branch: 'MOODLE_501_STABLE'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd
          ini-values: max_input_vars=5000
          coverage: none

      - name: Deploy moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle
        run: >
          moodle-plugin-ci install
          --plugin ./plugin
          --branch ${{ matrix.moodle-branch }}
          --db-type=pgsql
          --db-user=postgres
          --db-host=127.0.0.1

      - name: Run phplint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Run phpcs
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Run phpdoc
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Run validate
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Run savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Run phpunit
        if: ${{ !cancelled() && hashFiles('plugin/tests/*.php', 'plugin/tests/**/*.php') != '' }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Run behat
        if: ${{ !cancelled() && hashFiles('plugin/tests/behat/*.feature', 'plugin/tests/behat/**/*.feature') != '' }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
